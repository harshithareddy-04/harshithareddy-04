<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="460" height="340" viewBox="0 0 460 340" role="img" aria-label="Top languages">
  <style>
    <![CDATA[
    .lang { opacity:0; animation: fade 0.5s ease forwards; }
    @keyframes fade { to { opacity:1; } }
    .lbar { transform-box:fill-box; transform-origin:left; transform:scaleX(0); animation: grow 1.1s cubic-bezier(.2,.9,.3,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    ]]>
  </style>
  <rect width="460" height="340" rx="18" fill="#120815" stroke="rgba(168,85,247,0.35)" stroke-width="1.4"/>
  <text x="40" y="42" font-family="Segoe UI,Ubuntu,sans-serif" font-size="18" font-weight="800" fill="#fce7f3">Top Languages</text>
  <text x="40" y="62" font-family="Segoe UI,Ubuntu,sans-serif" font-size="11" fill="#c4b5fd">Estimated mix · local card</text>
  
    <g class="lang" style="animation-delay:0.30s">
      <text x="40" y="80" font-family="Segoe UI,Ubuntu,sans-serif" font-size="14" fill="#fce7f3">JavaScript</text>
      <text x="400" y="80" text-anchor="end" font-family="Consolas,Courier New,monospace" font-size="12" fill="#e9d5ff">42%</text>
      <rect x="40" y="90" width="360" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
      <rect class="lbar" x="40" y="90" width="151" height="12" rx="6" fill="#f7df1e" style="animation-delay:0.50s"/>
    </g>
    <g class="lang" style="animation-delay:0.45s">
      <text x="40" y="128" font-family="Segoe UI,Ubuntu,sans-serif" font-size="14" fill="#fce7f3">TypeScript</text>
      <text x="400" y="128" text-anchor="end" font-family="Consolas,Courier New,monospace" font-size="12" fill="#e9d5ff">22%</text>
      <rect x="40" y="138" width="360" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
      <rect class="lbar" x="40" y="138" width="79" height="12" rx="6" fill="#3178c6" style="animation-delay:0.65s"/>
    </g>
    <g class="lang" style="animation-delay:0.60s">
      <text x="40" y="176" font-family="Segoe UI,Ubuntu,sans-serif" font-size="14" fill="#fce7f3">CSS</text>
      <text x="400" y="176" text-anchor="end" font-family="Consolas,Courier New,monospace" font-size="12" fill="#e9d5ff">18%</text>
      <rect x="40" y="186" width="360" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
      <rect class="lbar" x="40" y="186" width="64" height="12" rx="6" fill="#a855f7" style="animation-delay:0.80s"/>
    </g>
    <g class="lang" style="animation-delay:0.75s">
      <text x="40" y="224" font-family="Segoe UI,Ubuntu,sans-serif" font-size="14" fill="#fce7f3">HTML</text>
      <text x="400" y="224" text-anchor="end" font-family="Consolas,Courier New,monospace" font-size="12" fill="#e9d5ff">12%</text>
      <rect x="40" y="234" width="360" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
      <rect class="lbar" x="40" y="234" width="43" height="12" rx="6" fill="#fb7185" style="animation-delay:0.95s"/>
    </g>
    <g class="lang" style="animation-delay:0.90s">
      <text x="40" y="272" font-family="Segoe UI,Ubuntu,sans-serif" font-size="14" fill="#fce7f3">Other</text>
      <text x="400" y="272" text-anchor="end" font-family="Consolas,Courier New,monospace" font-size="12" fill="#e9d5ff">6%</text>
      <rect x="40" y="282" width="360" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
      <rect class="lbar" x="40" y="282" width="21" height="12" rx="6" fill="#94a3b8" style="animation-delay:1.10s"/>
